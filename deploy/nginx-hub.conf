# Nginx reverse-proxy vhost for FlowTech Hub, sitting in front of the container
# that listens on 127.0.0.1:8080. Put this at:
#   /etc/nginx/sites-available/hub.flowtechapps.com   (then symlink to sites-enabled)
# then:  nginx -t && systemctl reload nginx
#        certbot --nginx -d hub.flowtechapps.com     (adds the 443 block + auto-renew)
#
# If you use CloudPanel/Apache instead, see DEPLOY.md — you don't need this file.

server {
    listen 80;
    listen [::]:80;
    server_name hub.flowtechapps.com;

    # Allow announcement banners / quick-link logo uploads (app caps ~8 MB).
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme; # so the app knows it's HTTPS
        proxy_read_timeout 120s;
    }
}
