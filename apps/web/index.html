<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <script>
      // Apply the saved theme before paint (dark is the default) to avoid a flash.
      try {
        var t = localStorage.getItem('ft-theme-v4');
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      } catch (e) {}
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0F7C8A" />
    <meta name="description" content="FlowTech Hub — the internal company intranet for FlowTech Apps." />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>FlowTech Hub — Company Intranet</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
